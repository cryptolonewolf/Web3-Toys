    <script>
      (function () {
        var excuses = [
          'The dev pulled the liquidity on this link and left for Dubai.',
          'This URL went to zero. It was a memecoin all along.',
          'Not your keys, not your page.',
          'The roadmap said this page would ship in Q4. It did not say which year.',
          'This link was airdropped to the wrong wallet.',
          'A whale bought every copy of this page and burned them.',
          'This page is still in its cliff. Check back in 12 months.',
          'Our validators could not agree that this page exists.',
          'Gas fees were too high to load this page.',
          'This page staked itself and is locked until further notice.',
          'The audit said this page was fine. The audit was wrong.',
          'Wen page? Soon. Very soon. Maybe.'
        ];
        var i = 0;
        var line = document.getElementById('excuse');
        document.getElementById('blame').addEventListener('click', function () {
          i = (i + 1) % excuses.length;
          line.textContent = excuses[i];
          if (window.WEB3TOYS) {
            window.WEB3TOYS.fx.wobble(document.querySelector('.lost-card'));
            window.WEB3TOYS.sound.play('buzz');
          }
        });
      })();
